name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          # The ubuntu-latest runner ships the Android SDK; just add the packages we need.
          SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature and print SHAs
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"

          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "---- Signer certificate (from the APK) ----"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" || true

          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          CERT_SHA=$(keytool -list -v -keystore keystore/stopwatch.keystore \
                      -storepass apexhub -storetype PKCS12 -alias stopwatch \
                      | grep -i "SHA256:" | sed 's/.*SHA256: //')

          {
            echo "## Build outputs"
            echo ""
            echo "### APK"
            echo "- Artifact: \`stopwatch-release\`"
            echo "- Size: $(stat -c%s "$APK") bytes"
            echo ""
            echo "### APK SHA-256  _(ApexHub upload / SDK download verification)_"
            echo '```'
            echo "$APK_SHA"
            echo '```'
            echo "### Signing certificate SHA-256  _(ApexHub certificate pinning)_"
            echo '```'
            echo "$CERT_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stopwatch-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
